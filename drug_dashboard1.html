<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทะเบียนยา | Pharmacy</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#17243a;--muted:#718096;--line:#e8edf4;--blue:#3267d6;--shadow:0 8px 24px rgba(28,48,80,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Thai",Tahoma,sans-serif;font-size:14px}
.app{max-width:1480px;margin:auto;padding:28px 30px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:25px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px}.asof{padding:9px 13px;border-radius:10px;font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;align-items:center}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;color:var(--ink)}
.btn{display:inline-block;border:0;background:#eaf0ff;color:#3159ac;padding:10px 14px;border-radius:9px;font-weight:700;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);background:#f8fafc;position:sticky;top:0}tbody tr:hover{background:#fafcff}.muted{color:var(--muted);font-size:12px}.count{margin:12px 0;color:var(--muted)}.empty{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:700px){.app{padding:18px 12px}table{min-width:900px}.card{overflow:auto}}
</style></head><body><main class="app">
<header class="top"><div><h1>ทะเบียนยา</h1><div class="sub">Drug Registry · รายการยาจากฐานข้อมูลร้านยา</div></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><a class="btn" href="./dashboard.html">กลับ Dashboard</a><div id="sourceBadge" class="asof">กำลังโหลดข้อมูล…</div></div></header>
<div class="toolbar"><input id="search" type="search" placeholder="ค้นหา SKU / ชื่อสามัญ / ความแรง" style="min-width:260px">
<select id="category"><option value="">ทุกหมวดหมู่</option></select></div>
<div id="count" class="count"></div><section class="card"><table><thead><tr><th>SKU</th><th>ชื่อสามัญ</th><th>ความแรง</th><th>รูปแบบยา</th><th>หน่วย</th><th>หมวดหมู่</th><th>ATC</th><th>จุดสั่งซื้อ</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">กำลังโหลด…</td></tr></tbody></table></section>
</main><script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[];
function badge(live,date){const b=$('sourceBadge');b.textContent=live?`ข้อมูลจาก Supabase · ${date||''}`:`ข้อมูลสำรองจากไฟล์ (ไม่ใช่ข้อมูลล่าสุด) · ${date||''}`;b.style.background=live?'#e5f7ed':'#fff3cd';b.style.color=live?'#187344':'#8a6500'}
async function fetchJSON(url,timeout=8000){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
 try{const r=await fetch(url,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}
 finally{clearTimeout(timer)}
}
async function load(){
 // เรียก API ของ Vercel และอ่านเฉพาะ .drugs ตามข้อกำหนดของทะเบียนยา
 try{
  const p=await fetchJSON('/api/data',8000);
  if(!p?.drugs?.items)throw Error('ไม่มี drugs.items');
  items=p.drugs.items;badge(true,p.drugs.meta?.as_of||'');
 }catch(apiError){
  // ทางสำรอง: เมื่อ /api/data ล้มเหลวหรือหมดเวลา 8 วินาที ให้อ่านไฟล์ drugs_update.json
  const p=await fetchJSON('./data/drugs_update.json');
  if(!p?.items)throw Error('ไม่พบข้อมูลในไฟล์สำรอง');
  items=p.items;badge(false,p.meta?.as_of||'');
 }
 const cats=[...new Set(items.map(x=>x.category).filter(Boolean))].sort();
 $('category').innerHTML='<option value="">ทุกหมวดหมู่</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
 render();
}
function render(){const q=$('search').value.toLowerCase().trim(),cat=$('category').value;
 const rows=items.filter(x=>(!cat||x.category===cat)&&(!q||[x.sku,x.generic_name,x.strength,x.dosage_form,x.atc_code].map(v=>String(v??'')).join(' ').toLowerCase().includes(q)));
 $('count').textContent=`แสดง ${rows.length.toLocaleString('th-TH')} จาก ${items.length.toLocaleString('th-TH')} SKU · ${new Set(items.map(x=>x.category)).size} หมวดหมู่`;
 $('rows').innerHTML=rows.map(x=>`<tr><td><b>${esc(x.sku)}</b></td><td>${esc(x.generic_name)}</td><td>${esc(x.strength)}</td><td>${esc(x.dosage_form)}</td><td>${esc(x.unit)}</td><td>${esc(x.category)}</td><td>${esc(x.atc_code)}</td><td>${esc(x.reorder_level)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">ไม่พบรายการ</td></tr>';
}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);
load().catch(e=>{$('rows').innerHTML=`<tr><td colspan="8" class="empty">ทดสอบผ่านลิงก์ Vercel เท่านั้น (Live Server ไม่รัน /api) · ${esc(e.message)}</td></tr>`});
</script></body></html>
